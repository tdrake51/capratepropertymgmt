name: Build and check capratepropertymgmt.com

# Runs the same build and checks Netlify runs, so problems show on the PR.
# Netlify (not GitHub Pages) serves capratepropertymgmt.com — see netlify.toml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caprate-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build the site from units.js
        run: node build.mjs
      - name: Check every link
        run: node check-links.mjs
      - name: Summary
        run: |
          {
            echo "## capratepropertymgmt.com build"
            echo
            echo "- Pages: $(find dist -name '*.html' | wc -l)"
            echo "- Homes: $(ls dist/homes | wc -l)"
            echo "- List updated: $(grep -o 'updated:"[^"]*"' units.js | cut -d'"' -f2)"
          } >> "$GITHUB_STEP_SUMMARY"
